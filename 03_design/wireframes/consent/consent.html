<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>PinDou · 使用前请阅读</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../shared/colors_and_type.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="consent.css" />
</head>
<body class="page page--consent">
  <div class="frame" data-variant="inner" data-title="使用前请阅读" data-back="../home/home.html">
    <main class="frame__body">

      <div class="consent__backdrop" aria-hidden="true"></div>

      <section class="consent__sheet" role="dialog" aria-labelledby="consent-title">
        <div class="consent__handle" aria-hidden="true"></div>

        <header class="consent__head">
          <h2 class="consent__title" id="consent-title">使用前请阅读</h2>
          <p class="consent__subtitle">三件事说清楚，再开始</p>
        </header>

        <ul class="consent__items" role="list">

          <li class="consent__item">
            <span class="consent__item-icon consent__item-icon--ai" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.94 14.06 2 12l7.94-2.06L12 2l2.06 7.94L22 12l-7.94 2.06L12 22z"/>
              </svg>
            </span>
            <div class="consent__item-text">
              <h3 class="consent__item-title">AI 辅助生成</h3>
              <p class="consent__item-desc">所有生成的图片都会标注"AI 辅助生成"。我们使用 OpenAI 模型处理你上传的图片。</p>
            </div>
          </li>

          <li class="consent__item">
            <span class="consent__item-icon consent__item-icon--portrait" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </span>
            <div class="consent__item-text">
              <h3 class="consent__item-title">人像授权</h3>
              <p class="consent__item-desc">如果图片包含他人肖像，需要获得对方授权。请不要上传未授权的明星 / 公众人物照片。</p>
            </div>
          </li>

          <li class="consent__item">
            <span class="consent__item-icon consent__item-icon--data" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/>
                <path d="M21 3v5h-5"/>
                <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/>
                <path d="M3 21v-5h5"/>
              </svg>
            </span>
            <div class="consent__item-text">
              <h3 class="consent__item-title">数据 30 天后自动删除</h3>
              <p class="consent__item-desc">原图仅用于生成你的拼豆图纸，不用于模型训练，不分享给第三方。生成的图纸保存在你的作品集，可随时删除。</p>
            </div>
          </li>

        </ul>

        <div class="consent__checks">
          <label class="consent__check">
            <input type="checkbox" class="consent__check-input" data-role="agreement" />
            <span class="consent__check-box" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12l5 5 9-11"/>
              </svg>
            </span>
            <span class="consent__check-label">
              我已阅读并同意
              <a href="#agreement" class="consent__link">《用户协议》</a>和
              <a href="#privacy" class="consent__link">《隐私政策》</a>
            </span>
          </label>

          <label class="consent__check">
            <input type="checkbox" class="consent__check-input" data-role="sensitive" />
            <span class="consent__check-box" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12l5 5 9-11"/>
              </svg>
            </span>
            <span class="consent__check-label">
              我同意上传含人像 / 宠物的图片用于生成（敏感个人信息单独同意）
            </span>
          </label>
        </div>

        <button type="button" class="btn btn--primary btn--block btn--lg consent__cta" data-action="accept" disabled>
          同意并开始
        </button>

        <a class="help-link consent__help" href="#help">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.5 9.5a2.5 2.5 0 1 1 5 0c0 1.5-2.5 2-2.5 3.5"/>
            <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
          </svg>
          <span class="help-link__label">为什么需要同意这些？</span>
        </a>

      </section>

    </main>
  </div>

  <script src="../shared/components.js"></script>
  <script src="consent.js"></script>
</body>
</html>
