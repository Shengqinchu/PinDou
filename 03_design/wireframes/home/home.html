<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>PinDou · 首页</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../shared/colors_and_type.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body class="page page--home">
  <div class="frame" data-variant="home" data-title="PinDou 拼豆图纸">
    <main class="frame__body">

      <div class="home__hero-wash" aria-hidden="true"></div>

      <!-- ===== Banner carousel ===== -->
      <section class="home__carousel" aria-label="拼豆样张">
        <div class="home__carousel-track" data-role="track">
          <article class="home__banner">
            <img class="home__banner-image" src="../shared/assets/bead-cat.svg" alt="萌宠拼豆样张" />
            <span class="tag tag--ai home__banner-badge">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.94 14.06 2 12l7.94-2.06L12 2l2.06 7.94L22 12l-7.94 2.06L12 22z"/>
              </svg>
              AI 生成
            </span>
            <div class="home__banner-caption">
              <span class="home__banner-title">萌宠拼豆</span>
              <span class="home__banner-meta">24×24 · 7 色</span>
            </div>
          </article>

          <article class="home__banner">
            <img class="home__banner-image" src="../shared/assets/bead-heart.svg" alt="情侣拼豆样张" />
            <span class="tag tag--ai home__banner-badge">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.94 14.06 2 12l7.94-2.06L12 2l2.06 7.94L22 12l-7.94 2.06L12 22z"/>
              </svg>
              AI 生成
            </span>
            <div class="home__banner-caption">
              <span class="home__banner-title">情侣拼豆</span>
              <span class="home__banner-meta">28×28 · 5 色</span>
            </div>
          </article>

          <article class="home__banner">
            <img class="home__banner-image" src="../shared/assets/bead-bunny.svg" alt="自拍 Q 版拼豆样张" />
            <span class="tag tag--ai home__banner-badge">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.94 14.06 2 12l7.94-2.06L12 2l2.06 7.94L22 12l-7.94 2.06L12 22z"/>
              </svg>
              AI 生成
            </span>
            <div class="home__banner-caption">
              <span class="home__banner-title">自拍 Q 版</span>
              <span class="home__banner-meta">32×32 · 8 色</span>
            </div>
          </article>
        </div>

        <nav class="home__dots" data-role="dots" aria-label="样张选择">
          <button type="button" class="home__dot home__dot--active" data-index="0" aria-label="第 1 张"></button>
          <button type="button" class="home__dot" data-index="1" aria-label="第 2 张"></button>
          <button type="button" class="home__dot" data-index="2" aria-label="第 3 张"></button>
        </nav>
      </section>

      <!-- ===== Hero copy ===== -->
      <section class="home__hero">
        <h1 class="home__headline">
          30 秒生成你的<span class="text-grad">拼豆图纸</span>
        </h1>
        <p class="home__subtitle">AI 帮你 Q 版化，宠物 / 情侣 / 自拍都能拼</p>
      </section>

      <!-- ===== Theme chips ===== -->
      <ul class="home__chips" role="list">
        <li class="chip">
          <span class="chip__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z"/>
              <path d="M8 14v.5"/><path d="M16 14v.5"/>
              <path d="M11.25 16.25h1.5L12 17l-.75-.75Z"/>
            </svg>
          </span>萌宠
        </li>
        <li class="chip">
          <span class="chip__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>
            </svg>
          </span>情侣
        </li>
        <li class="chip">
          <span class="chip__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
          </span>自拍
        </li>
      </ul>

      <!-- ===== CTA ===== -->
      <div class="home__cta-wrap">
        <a class="btn btn--primary btn--block btn--lg home__cta" href="../upload/upload.html">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
          立即上传照片
        </a>
        <p class="home__cta-hint">支持 JPG / PNG · 单张图片 ≤ 10MB</p>
      </div>

      <!-- ===== Tab bar ===== -->
      <nav class="tabbar" aria-label="主导航">
        <a class="tabbar__item tabbar__item--active" href="home.html">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="tabbar__label">首页</span>
        </a>
        <a class="tabbar__item" href="#works">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3"  y="3"  width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="13" y="3"  width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="3"  y="13" width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="13" y="13" width="8" height="8" rx="2.5" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3"  y="3"  width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13" y="3"  width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="3"  y="13" width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13" y="13" width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span class="tabbar__label">我的作品</span>
        </a>
        <a class="tabbar__item" href="#me">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4.5" fill="currentColor"/>
            <path d="M3 21c0-4.5 4-8 9-8s9 3.5 9 8" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="tabbar__label">我的</span>
        </a>
      </nav>

    </main>
  </div>

  <script src="../shared/components.js"></script>
  <script src="home.js"></script>
</body>
</html>
