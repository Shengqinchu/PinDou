<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>PinDou · 我的作品</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../shared/colors_and_type.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="works.css" />
</head>
<body class="page page--works">
  <div class="frame" data-variant="home" data-title="我的作品">
    <main class="frame__body frame__body--scroll">

      <!-- ===== Filled state ===== -->
      <section class="works" data-state="filled">

        <div class="works__stats">
          <div class="works__stat">
            <span class="works__stat-num">12</span>
            <span class="works__stat-label">总作品</span>
          </div>
          <span class="works__stat-divider" aria-hidden="true"></span>
          <div class="works__stat">
            <span class="works__stat-num">5</span>
            <span class="works__stat-label">本月新增</span>
          </div>
        </div>

        <ul class="works__grid" role="list">
          <li class="works__card">
            <a class="works__card-link" href="../result-basic/result-basic.html">
              <img class="works__thumb" src="../shared/assets/bead-cat.svg" alt="萌宠拼豆 · Q 版小橘" />
              <h3 class="works__title">萌宠拼豆 · Q 版小橘</h3>
              <p class="works__meta">487 颗 · 7 色</p>
            </a>
            <button type="button" class="works__more" data-action="menu" aria-label="更多操作">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5"  cy="12" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </li>

          <li class="works__card">
            <a class="works__card-link" href="../result-basic/result-basic.html">
              <img class="works__thumb" src="../shared/assets/bead-heart.svg" alt="情侣拼豆" />
              <h3 class="works__title">情侣拼豆 · 周年纪念</h3>
              <p class="works__meta">784 颗 · 5 色</p>
            </a>
            <button type="button" class="works__more" data-action="menu" aria-label="更多操作">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5"  cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </li>

          <li class="works__card">
            <a class="works__card-link" href="../result-basic/result-basic.html">
              <img class="works__thumb" src="../shared/assets/bead-bunny.svg" alt="自拍 Q 版" />
              <h3 class="works__title">自拍 Q 版 · 五一</h3>
              <p class="works__meta">1024 颗 · 8 色</p>
              <span class="works__premium-tag tag tag--ai">月卡</span>
            </a>
            <button type="button" class="works__more" data-action="menu" aria-label="更多操作">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5"  cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </li>

          <li class="works__card">
            <a class="works__card-link" href="../result-basic/result-basic.html">
              <img class="works__thumb" src="../shared/assets/bead-cat.svg" alt="萌宠拼豆" />
              <h3 class="works__title">萌宠拼豆 · 阿黄</h3>
              <p class="works__meta">487 颗 · 6 色</p>
            </a>
            <button type="button" class="works__more" data-action="menu" aria-label="更多操作">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <circle cx="5"  cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              </svg>
            </button>
          </li>
        </ul>

        <a class="works__more-cta" href="../home/home.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          再生成一张
        </a>

      </section>

      <!-- ===== Empty state ===== -->
      <section class="works__empty" data-state="empty" hidden>
        <div class="works__empty-art" aria-hidden="true">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
            <rect x="20" y="30" width="80" height="60" rx="12" fill="var(--pd-pink-100)"/>
            <rect x="30" y="40" width="60" height="40" rx="8" fill="#fff"/>
            <circle cx="60" cy="60" r="14" fill="var(--pd-peach-50)"/>
            <path d="M53 60l5 5 9-10" stroke="var(--pd-orange)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="works__empty-title">还没有作品哦</h2>
        <p class="works__empty-sub">上传一张照片，30 秒就能生成你的第一张拼豆图纸</p>
        <a class="btn btn--primary btn--lg works__empty-cta" href="../home/home.html">
          立即生成
        </a>
      </section>

      <!-- ===== Action sheet for "更多" ===== -->
      <div class="works__sheet" data-state="closed" hidden>
        <button type="button" class="works__sheet-backdrop" data-action="close-menu" aria-label="关闭"></button>
        <div class="works__sheet-panel" role="dialog" aria-label="作品操作">
          <button type="button" class="works__sheet-item" data-action="share">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <path d="M16 6l-4-4-4 4"/>
              <path d="M12 2v13"/>
            </svg>
            分享到小红书
          </button>
          <button type="button" class="works__sheet-item works__sheet-item--danger" data-action="delete">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
            删除作品
          </button>
          <button type="button" class="works__sheet-cancel" data-action="close-menu">取消</button>
        </div>
      </div>

      <!-- ===== Tab bar ===== -->
      <nav class="tabbar" aria-label="主导航">
        <a class="tabbar__item" href="../home/home.html">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span class="tabbar__label">首页</span>
        </a>
        <a class="tabbar__item tabbar__item--active" href="works.html">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3"  y="3"  width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="13" y="3"  width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="3"  y="13" width="8" height="8" rx="2.5" fill="currentColor"/>
            <rect x="13" y="13" width="8" height="8" rx="2.5" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3"  y="3"  width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13" y="3"  width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="3"  y="13" width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13" y="13" width="8" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span class="tabbar__label">我的作品</span>
        </a>
        <a class="tabbar__item" href="../me/me.html">
          <svg class="tabbar__icon tabbar__icon--filled" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4.5" fill="currentColor"/>
            <path d="M3 21c0-4.5 4-8 9-8s9 3.5 9 8" fill="currentColor"/>
          </svg>
          <svg class="tabbar__icon tabbar__icon--outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span class="tabbar__label">我的</span>
        </a>
      </nav>

    </main>
  </div>

  <script src="../shared/components.js"></script>
  <script src="works.js"></script>
</body>
</html>
