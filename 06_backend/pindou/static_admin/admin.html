<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PinDou Admin Console</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --muted: #657083;
      --text: #17202f;
      --brand: #1f6feb;
      --brand-soft: #e8f0ff;
      --danger: #c7352b;
      --danger-soft: #fdecea;
      --ok: #16794a;
      --ok-soft: #e8f6ef;
      --warn: #9a6700;
      --warn-soft: #fff4d6;
      --shadow: 0 1px 2px rgba(18, 25, 38, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      height: 32px;
      padding: 0 10px;
      cursor: pointer;
    }
    button:hover { border-color: #9aa7ba; }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    input, select { height: 32px; padding: 0 10px; }
    textarea {
      min-height: 88px;
      resize: vertical;
      padding: 8px 10px;
      line-height: 1.45;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.12);
    }
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-panel {
      width: min(380px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .login-title {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 700;
    }
    .field { margin-bottom: 12px; }
    .label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .ghost-danger {
      color: var(--danger);
      border-color: #e1a09a;
      background: #fff;
    }
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 176px minmax(0, 1fr);
      grid-template-rows: 52px minmax(0, 1fr);
    }
    .topbar {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #111827;
      color: #fff;
      padding: 0 16px;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 700;
    }
    .role-pill {
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 2px 8px;
      color: #c9d2e3;
      font-size: 12px;
      font-weight: 500;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 10px;
    }
    .tab-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 34px;
      margin-bottom: 4px;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .tab-button.active {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 700;
    }
    .batch-tag {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }
    .main {
      min-width: 0;
      padding: 14px;
      overflow: auto;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }
    .section-title h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;
      margin-bottom: 10px;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .toolbar .field {
      width: 190px;
      margin: 0;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      min-height: 82px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .metric.clickable { cursor: pointer; }
    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      background: #fbfcfe;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #f8fbff; }
    tr.legacy-row td { background: #fff8f7; }
    tr:last-child td { border-bottom: 0; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      background: #eef2f7;
      color: #445066;
    }
    .status-paid_confirmed,
    .status-paid_via_hupijiao {
      background: var(--ok-soft);
      color: var(--ok);
    }
    .status-cancelled,
    .status-refunded {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .status-manual_payment_confirmed,
    .status-pending_qr,
    .status-pending_cs_qr {
      background: var(--warn-soft);
      color: var(--warn);
    }
    .detail-row td {
      background: #fafbfc;
      white-space: normal;
      padding: 0;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }
    .detail-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }
    .detail-box h3 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .kv {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 6px 8px;
      font-size: 13px;
    }
    .kv-key { color: var(--muted); }
    .kv-value { min-width: 0; overflow-wrap: anywhere; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .log-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
    }
    .log-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .log-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      background: #eef2f7;
      color: #445066;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.bad { background: var(--danger-soft); color: var(--danger); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .inline-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .field.full { grid-column: 1 / -1; }
    .danger-note {
      color: var(--danger);
      font-size: 12px;
      line-height: 1.5;
    }
    .code-output {
      width: 100%;
      min-height: 120px;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }
    .thumb {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      border: 1px solid var(--line);
      object-fit: cover;
      background: #f3f5f8;
    }
    .thumb-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .config-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .config-block {
      padding: 10px;
      border-right: 1px solid var(--line);
    }
    .config-block:last-child { border-right: 0; }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.18);
      z-index: 20;
    }
    .drawer {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 0;
      width: min(520px, 100%);
      background: var(--panel);
      border-left: 1px solid var(--line);
      box-shadow: -12px 0 32px rgba(15, 23, 42, 0.16);
      z-index: 21;
      display: flex;
      flex-direction: column;
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-head h2 {
      margin: 0;
      font-size: 16px;
    }
    .drawer-body {
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }
    .drawer-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .drawer-section h3 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .checkbox-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
    }
    .checkbox-row input {
      width: auto;
      height: auto;
      margin-top: 3px;
    }
    details {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: #fbfcfe;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
    }
    pre {
      max-height: 220px;
      overflow: auto;
      margin: 8px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.45;
    }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }
    .placeholder {
      padding: 30px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed #bac4d2;
      border-radius: 8px;
    }
    .feedback {
      min-height: 30px;
      margin-bottom: 10px;
    }
    .alert {
      display: inline-flex;
      max-width: 100%;
      border-radius: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .alert.ok { border-color: #9ed8bb; background: var(--ok-soft); color: var(--ok); }
    .alert.bad { border-color: #f0b4ae; background: var(--danger-soft); color: var(--danger); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, 0.45);
      z-index: 30;
    }
    .modal {
      width: min(520px, 100%);
      background: var(--panel);
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 46px rgba(15, 23, 42, 0.22);
    }
    .modal-head, .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }
    .modal-body { padding: 14px; }
    .modal h2 {
      margin: 0;
      font-size: 16px;
    }
    .impact {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      padding: 10px;
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
    }
    .loading {
      opacity: 0.66;
      pointer-events: none;
    }
    @media (max-width: 920px) {
      .app-shell {
        grid-template-columns: 1fr;
        grid-template-rows: 52px auto minmax(0, 1fr);
      }
      .topbar { grid-column: 1; }
      .sidebar {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .tab-button {
        min-width: 110px;
        margin-bottom: 0;
      }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: 1fr; }
      .config-grid { grid-template-columns: 1fr; }
      .config-block { border-right: 0; border-bottom: 1px solid var(--line); }
      .config-block:last-child { border-bottom: 0; }
      .toolbar .field { width: 100%; }
    }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .drawer { top: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const { createApp } = Vue;
    const TOKEN_KEY = "pindou_admin_token";
    const API_BASE = "/api/v1/admin";

    createApp({
      data() {
        return {
          token: localStorage.getItem(TOKEN_KEY) || "",
          role: localStorage.getItem("pindou_admin_role") || "",
          loginForm: { username: "", password: "" },
          loginLoading: false,
          activeTab: "dashboard",
          tabs: [
            ["dashboard", "Dashboard", ""],
            ["orders", "订单", ""],
            ["cdks", "CDK", ""],
            ["users", "用户", ""],
            ["artworks", "作品", ""],
            ["config", "配置", ""],
            ["audit", "审计", ""]
          ],
          feedback: null,
          dashboard: null,
          dashboardLoading: false,
          orders: { items: [], total: 0, page: 1, size: 20 },
          orderFilters: { status: "", search: "" },
          orderLoading: false,
          expandedOrderNo: "",
          orderDetails: {},
          cdks: { items: [], total: 0, page: 1, size: 20 },
          cdkFilters: { status: "", type: "", batch_id: "" },
          cdkLoading: false,
          cdkBatchOpen: false,
          cdkBatchLoading: false,
          cdkForm: { type: "credit_pack_5", value: 5, count: 10, sales_channel: "", expires_at: "", notes: "", reason: "" },
          cdkGenerated: null,
          users: { items: [], total: 0, page: 1, size: 20 },
          userFilters: { search: "" },
          userLoading: false,
          selectedUser: null,
          userDetailLoading: false,
          creditForm: { delta_free: "", delta_paid: "", set_monthly_card_days: "", reason: "" },
          artworks: { items: [], total: 0, page: 1, size: 20 },
          artworkFilters: { user_id: "" },
          artworkLoading: false,
          configData: null,
          configLoading: false,
          auditLogs: { items: [], total: 0, page: 1, size: 20 },
          auditFilters: { action: "", resource_type: "", actor_id: "" },
          auditLoading: false,
          expandedAuditId: null,
          modal: null
        };
      },
      computed: {
        isAuthed() {
          return Boolean(this.token);
        },
        activeTabLabel() {
          const found = this.tabs.find(([key]) => key === this.activeTab);
          return found ? found[1] : "";
        }
      },
      mounted() {
        if (this.isAuthed) {
          this.loadActiveTab();
        }
      },
      methods: {
        async api(path, options = {}) {
          const headers = Object.assign({}, options.headers || {});
          if (this.token) headers.Authorization = `Bearer ${this.token}`;
          if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
          const response = await fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
          if (response.status === 401) {
            this.logout("登录已过期，请重新登录。");
            throw new Error("AUTH_REQUIRED");
          }
          const contentType = response.headers.get("content-type") || "";
          const payload = contentType.includes("application/json") ? await response.json() : await response.text();
          if (!response.ok) {
            const message = this.errorMessage(payload, response.status);
            throw new Error(message);
          }
          return payload;
        },
        errorMessage(payload, status) {
          if (!payload) return `请求失败 (${status})`;
          if (payload.message_cn) return payload.message_cn;
          if (payload.detail) return Array.isArray(payload.detail) ? JSON.stringify(payload.detail) : payload.detail;
          if (payload.error) return payload.error;
          return `请求失败 (${status})`;
        },
        async login() {
          this.loginLoading = true;
          this.feedback = null;
          try {
            const payload = await this.api("/login", {
              method: "POST",
              body: JSON.stringify(this.loginForm)
            });
            this.token = payload.token;
            this.role = payload.role || "admin";
            localStorage.setItem(TOKEN_KEY, this.token);
            localStorage.setItem("pindou_admin_role", this.role);
            this.loginForm.password = "";
            this.showOk("登录成功。");
            await this.loadActiveTab();
          } catch (error) {
            this.showBad(error.message);
          } finally {
            this.loginLoading = false;
          }
        },
        logout(message) {
          this.token = "";
          this.role = "";
          localStorage.removeItem(TOKEN_KEY);
          localStorage.removeItem("pindou_admin_role");
          this.expandedOrderNo = "";
          this.orderDetails = {};
          if (message) this.showBad(message);
        },
        switchTab(tab) {
          this.activeTab = tab;
          this.feedback = null;
          this.loadActiveTab();
        },
        refreshActiveTab() {
          this.loadActiveTab(true);
        },
        loadActiveTab(force = false) {
          if (this.activeTab === "dashboard") return this.loadDashboard();
          if (this.activeTab === "orders") return this.loadOrders(force ? this.orders.page : this.orders.page || 1);
          if (this.activeTab === "cdks") return this.loadCdks(force ? this.cdks.page : this.cdks.page || 1);
          if (this.activeTab === "users") return this.loadUsers(force ? this.users.page : this.users.page || 1);
          if (this.activeTab === "artworks") return this.loadArtworks(force ? this.artworks.page : this.artworks.page || 1);
          if (this.activeTab === "config") return this.loadConfig();
          if (this.activeTab === "audit") return this.loadAuditLogs(force ? this.auditLogs.page : this.auditLogs.page || 1);
          return null;
        },
        showOk(message) {
          this.feedback = { type: "ok", message };
          window.setTimeout(() => {
            if (this.feedback && this.feedback.message === message) this.feedback = null;
          }, 3200);
        },
        showBad(message) {
          this.feedback = { type: "bad", message };
        },
        async loadDashboard() {
          if (!this.token) return;
          this.dashboardLoading = true;
          try {
            this.dashboard = await this.api("/dashboard");
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.dashboardLoading = false;
          }
        },
        async loadOrders(page = this.orders.page || 1) {
          if (!this.token) return;
          this.orderLoading = true;
          const params = new URLSearchParams({
            page: String(page),
            size: String(this.orders.size)
          });
          if (this.orderFilters.status) params.set("status", this.orderFilters.status);
          if (this.orderFilters.search.trim()) params.set("search", this.orderFilters.search.trim());
          try {
            const payload = await this.api(`/orders?${params.toString()}`);
            this.orders = payload;
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.orderLoading = false;
          }
        },
        resetOrderFilters() {
          this.orderFilters.status = "";
          this.orderFilters.search = "";
          this.loadOrders(1);
        },
        jumpToAbnormalOrders() {
          this.activeTab = "orders";
          this.orderFilters.status = "cancelled";
          this.loadOrders(1);
        },
        async toggleOrder(order) {
          if (this.expandedOrderNo === order.order_no) {
            this.expandedOrderNo = "";
            return;
          }
          this.expandedOrderNo = order.order_no;
          if (!this.orderDetails[order.order_no]) {
            await this.loadOrderDetail(order.order_no);
          }
        },
        async loadOrderDetail(orderNo) {
          try {
            this.orderDetails[orderNo] = await this.api(`/orders/${encodeURIComponent(orderNo)}`);
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          }
        },
        async loadCdks(page = this.cdks.page || 1) {
          if (!this.token) return;
          this.cdkLoading = true;
          const params = new URLSearchParams({ page: String(page), size: String(this.cdks.size) });
          if (this.cdkFilters.status) params.set("status", this.cdkFilters.status);
          if (this.cdkFilters.type) params.set("type", this.cdkFilters.type);
          if (this.cdkFilters.batch_id.trim()) params.set("batch_id", this.cdkFilters.batch_id.trim());
          try {
            this.cdks = await this.api(`/cdks?${params.toString()}`);
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.cdkLoading = false;
          }
        },
        resetCdkFilters() {
          this.cdkFilters = { status: "", type: "", batch_id: "" };
          this.loadCdks(1);
        },
        openCdkBatch() {
          this.cdkBatchOpen = true;
          this.cdkGenerated = null;
        },
        closeCdkBatch() {
          if (!this.cdkBatchLoading) this.cdkBatchOpen = false;
        },
        async submitCdkBatch() {
          if (!this.cdkForm.reason.trim()) {
            this.showBad("请填写 reason。");
            return;
          }
          const body = {
            type: this.cdkForm.type,
            value: Number(this.cdkForm.value),
            count: Number(this.cdkForm.count),
            reason: this.cdkForm.reason.trim()
          };
          if (this.cdkForm.sales_channel.trim()) body.sales_channel = this.cdkForm.sales_channel.trim();
          if (this.cdkForm.expires_at) body.expires_at = this.cdkForm.expires_at;
          if (this.cdkForm.notes.trim()) body.notes = this.cdkForm.notes.trim();
          this.cdkBatchLoading = true;
          try {
            const payload = await this.api("/cdks/batch", {
              method: "POST",
              body: JSON.stringify(body)
            });
            this.cdkGenerated = payload;
            this.showOk(`CDK 批次已生成，batch_id=${payload.batch_id}，audit_id=${payload.audit_id}`);
            await this.loadCdks(1);
            await this.loadDashboard();
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.cdkBatchLoading = false;
          }
        },
        async copyGeneratedCodes() {
          if (!this.cdkGenerated || !this.cdkGenerated.codes) return;
          const text = this.cdkGenerated.codes.join("\n");
          if (!navigator.clipboard) {
            this.showBad("当前浏览器不支持剪贴板 API。");
            return;
          }
          await navigator.clipboard.writeText(text);
          this.showOk("codes 已复制。");
        },
        async downloadCdkCsv() {
          const params = new URLSearchParams();
          if (this.cdkFilters.status) params.set("status", this.cdkFilters.status);
          if (this.cdkFilters.batch_id.trim()) params.set("batch_id", this.cdkFilters.batch_id.trim());
          try {
            const response = await fetch(`${API_BASE}/cdks/export.csv?${params.toString()}`, {
              headers: { Authorization: `Bearer ${this.token}` }
            });
            if (response.status === 401) {
              this.logout("登录已过期，请重新登录。");
              return;
            }
            if (!response.ok) throw new Error(await response.text());
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "pindou-cdks.csv";
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
          } catch (error) {
            this.showBad(error.message || "导出 CSV 失败。");
          }
        },
        async loadUsers(page = this.users.page || 1) {
          if (!this.token) return;
          this.userLoading = true;
          const params = new URLSearchParams({ page: String(page), size: String(this.users.size) });
          if (this.userFilters.search.trim()) params.set("search", this.userFilters.search.trim());
          try {
            this.users = await this.api(`/users?${params.toString()}`);
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.userLoading = false;
          }
        },
        resetUserFilters() {
          this.userFilters.search = "";
          this.loadUsers(1);
        },
        async selectUser(user) {
          const openid = user.user_id || user.openid;
          this.selectedUser = user;
          await this.loadUserDetail(openid);
        },
        async loadUserDetail(openid) {
          this.userDetailLoading = true;
          try {
            this.selectedUser = await this.api(`/users/${encodeURIComponent(openid)}`);
            this.resetCreditForm();
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.userDetailLoading = false;
          }
        },
        closeUserDrawer() {
          this.selectedUser = null;
        },
        resetCreditForm() {
          this.creditForm = { delta_free: "", delta_paid: "", set_monthly_card_days: "", reason: "" };
        },
        openCreditModal() {
          if (!this.selectedUser) return;
          const deltaFree = this.optionalNumber(this.creditForm.delta_free);
          const deltaPaid = this.optionalNumber(this.creditForm.delta_paid);
          const monthlyDays = this.optionalNumber(this.creditForm.set_monthly_card_days);
          if (deltaFree === null && deltaPaid === null && monthlyDays === null) {
            this.showBad("至少填写一个额度或月卡字段。");
            return;
          }
          if (!this.creditForm.reason.trim()) {
            this.showBad("请填写 reason。");
            return;
          }
          const payload = {};
          const impactLines = [
            `用户：${this.selectedUser.user_id}`,
            `当前免费额度：${this.selectedUser.free_credits_remaining}`,
            `当前付费额度：${this.selectedUser.paid_credits}`
          ];
          if (deltaFree !== null) {
            payload.delta_free = deltaFree;
            impactLines.push(`免费额度变动：${deltaFree} → ${Number(this.selectedUser.free_credits_remaining || 0) + deltaFree}`);
          }
          if (deltaPaid !== null) {
            payload.delta_paid = deltaPaid;
            impactLines.push(`付费额度变动：${deltaPaid} → ${Number(this.selectedUser.paid_credits || 0) + deltaPaid}`);
          }
          if (monthlyDays !== null) {
            payload.set_monthly_card_days = monthlyDays;
            impactLines.push(monthlyDays === 0 ? "月卡到期：清空" : `月卡到期：从现在起 ${monthlyDays} 天`);
          }
          const needsSecondConfirm = Math.abs(deltaFree || 0) > 100 || Math.abs(deltaPaid || 0) > 100;
          this.modal = {
            kind: "credits",
            title: "调整用户额度",
            endpoint: `/users/${encodeURIComponent(this.selectedUser.user_id)}/credits`,
            user: this.selectedUser,
            payload,
            impactLines,
            reason: this.creditForm.reason.trim(),
            loading: false,
            requiresSecondConfirm: needsSecondConfirm,
            secondConfirmed: false
          };
        },
        async loadArtworks(page = this.artworks.page || 1) {
          if (!this.token) return;
          this.artworkLoading = true;
          const params = new URLSearchParams({ page: String(page), size: String(this.artworks.size) });
          if (this.artworkFilters.user_id.trim()) params.set("user_id", this.artworkFilters.user_id.trim());
          try {
            this.artworks = await this.api(`/artworks?${params.toString()}`);
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.artworkLoading = false;
          }
        },
        resetArtworkFilters() {
          this.artworkFilters.user_id = "";
          this.loadArtworks(1);
        },
        async loadConfig() {
          if (!this.token) return;
          this.configLoading = true;
          try {
            this.configData = await this.api("/config");
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.configLoading = false;
          }
        },
        async loadAuditLogs(page = this.auditLogs.page || 1) {
          if (!this.token) return;
          this.auditLoading = true;
          const params = new URLSearchParams({ page: String(page), size: String(this.auditLogs.size) });
          if (this.auditFilters.action.trim()) params.set("action", this.auditFilters.action.trim());
          if (this.auditFilters.resource_type.trim()) params.set("resource_type", this.auditFilters.resource_type.trim());
          if (this.auditFilters.actor_id.trim()) params.set("actor_id", this.auditFilters.actor_id.trim());
          try {
            this.auditLogs = await this.api(`/audit-logs?${params.toString()}`);
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            this.auditLoading = false;
          }
        },
        resetAuditFilters() {
          this.auditFilters = { action: "", resource_type: "", actor_id: "" };
          this.loadAuditLogs(1);
        },
        toggleAudit(log) {
          this.expandedAuditId = this.expandedAuditId === log.id ? null : log.id;
        },
        openActionModal(type, order) {
          const detail = this.orderDetails[order.order_no] || order;
          const entitlement = this.entitlementText(detail);
          this.modal = {
            kind: "order",
            type,
            order,
            reason: "",
            loading: false,
            title: type === "confirm" ? "确认收款事实" : "发放订单权益",
            impactLines: [
              `订单：${order.order_no}`,
              `用户：${order.user_id}`,
              type === "confirm" ? "影响：仅标记已收到款，不发放权益。" : `影响：将${entitlement}。`
            ],
            endpoint: type === "confirm"
              ? `/orders/${encodeURIComponent(order.order_no)}/confirm-payment-fact`
              : `/orders/${encodeURIComponent(order.order_no)}/grant-entitlement`,
            payload: {},
            requiresSecondConfirm: false,
            secondConfirmed: false
          };
        },
        closeModal() {
          if (!this.modal || !this.modal.loading) this.modal = null;
        },
        async submitModal() {
          if (!this.modal || !this.modal.reason.trim()) {
            this.showBad("请填写 reason。");
            return;
          }
          if (this.modal.requiresSecondConfirm && !this.modal.secondConfirmed) {
            this.showBad("这次额度变动超过 100，请完成二次确认。");
            return;
          }
          this.modal.loading = true;
          const currentModal = this.modal;
          try {
            const payload = await this.api(currentModal.endpoint, {
              method: "POST",
              body: JSON.stringify(Object.assign({}, currentModal.payload || {}, { reason: currentModal.reason.trim() }))
            });
            if (currentModal.kind === "order") {
              this.showOk(`${payload.message || "操作完成。"} audit_id=${payload.audit_id}`);
              const orderNo = currentModal.order.order_no;
              this.modal = null;
              await this.loadOrders(this.orders.page);
              await this.loadOrderDetail(orderNo);
              this.expandedOrderNo = orderNo;
              await this.loadDashboard();
            } else if (currentModal.kind === "credits") {
              this.showOk(`额度已调整，audit_id=${payload.audit_id}`);
              const openid = currentModal.user.user_id;
              this.modal = null;
              await this.loadUsers(this.users.page);
              await this.loadUserDetail(openid);
              await this.loadDashboard();
            }
          } catch (error) {
            if (error.message !== "AUTH_REQUIRED") this.showBad(error.message);
          } finally {
            if (this.modal) this.modal.loading = false;
          }
        },
        formatMoney(value) {
          const number = Number(value || 0);
          return number.toFixed(2);
        },
        formatDate(value) {
          if (!value) return "-";
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return value;
          return date.toLocaleString("zh-CN", { hour12: false });
        },
        formatPercent(value) {
          return `${(Number(value || 0) * 100).toFixed(1)}%`;
        },
        optionalNumber(value) {
          if (value === "" || value === null || value === undefined) return null;
          const number = Number(value);
          return Number.isFinite(number) ? number : null;
        },
        statusText(status) {
          const map = {
            pending_qr: "待支付",
            pending_cs_qr: "客服待付",
            manual_payment_confirmed: "人工已收款",
            paid_confirmed: "已支付",
            paid_via_hupijiao: "已支付",
            cancelled: "已取消",
            refunded: "已退款"
          };
          return map[status] || status || "-";
        },
        cdkTypeText(type) {
          const map = {
            single_use: "单次兑换",
            monthly_card: "月卡",
            credit_pack_5: "5 额度包",
            credit_pack_10: "10 额度包"
          };
          return map[type] || type || "-";
        },
        cdkStatusText(status) {
          const map = { active: "可用", redeemed: "已兑换", expired: "已过期", disabled: "已禁用" };
          return map[status] || status || "-";
        },
        creditDeltaText(value) {
          if (value === "" || value === null || value === undefined) return "-";
          const number = Number(value);
          if (!Number.isFinite(number)) return value;
          return number > 0 ? `+${number}` : String(number);
        },
        boolBadgeClass(value) {
          if (value === true) return "ok";
          if (value === false) return "bad";
          return "";
        },
        amountBadgeClass(value) {
          if (value === false) return "bad";
          if (value === true) return "ok";
          return "";
        },
        boolText(value, trueText, falseText) {
          if (value === true) return trueText;
          if (value === false) return falseText;
          return "未知";
        },
        paymentProviderText(provider) {
          return provider === "hupijiao" ? "虎皮椒" : "客服";
        },
        entitlementText(order) {
          if (!order) return "发放权益";
          if (order.sku === "single_9.9") return `给用户 ${order.user_id} 增加 1 个付费额度`;
          if (order.sku === "monthly_28") return `给用户 ${order.user_id} 开通 30 天月卡`;
          if (order.sku === "custom_99") return `解锁作品 ${order.artwork_id || "-"}`;
          return `按 SKU ${order.sku} 发放权益给 ${order.user_id}`;
        },
        previewSrc(artwork) {
          return artwork.preview_path || artwork.preview_url || artwork.thumbnail_url || "";
        },
        configPublicRows() {
          return this.flattenConfig(this.configData ? this.configData.public : {}, "");
        },
        configSensitiveRows() {
          const sensitive = this.configData ? this.configData.sensitive || {} : {};
          return Object.entries(sensitive).map(([key, value]) => ({
            key,
            env: value.env || key,
            configured: Boolean(value.configured),
            scheme: value.scheme || "-",
            password_configured: value.password_configured,
            host_configured: value.host_configured,
            database_configured: value.database_configured
          }));
        },
        flattenConfig(value, prefix) {
          const rows = [];
          Object.entries(value || {}).forEach(([key, item]) => {
            const path = prefix ? `${prefix}.${key}` : key;
            if (item && typeof item === "object" && !Array.isArray(item)) {
              rows.push(...this.flattenConfig(item, path));
            } else {
              rows.push({ key: path, value: Array.isArray(item) ? item.join(", ") : String(item) });
            }
          });
          return rows;
        },
        jsonText(value) {
          return JSON.stringify(value || {}, null, 2);
        },
        changePage(collection, delta) {
          const state = this[collection];
          const maxPage = Math.max(1, Math.ceil(state.total / state.size));
          const page = Math.min(maxPage, Math.max(1, state.page + delta));
          if (page === state.page) return;
          if (collection === "orders") this.loadOrders(page);
          if (collection === "cdks") this.loadCdks(page);
          if (collection === "users") this.loadUsers(page);
          if (collection === "artworks") this.loadArtworks(page);
          if (collection === "auditLogs") this.loadAuditLogs(page);
        },
        previousPage() {
          if (this.orders.page > 1) this.loadOrders(this.orders.page - 1);
        },
        nextPage() {
          const maxPage = Math.max(1, Math.ceil(this.orders.total / this.orders.size));
          if (this.orders.page < maxPage) this.loadOrders(this.orders.page + 1);
        }
      },
      template: `
        <div v-if="!isAuthed" class="login-page">

            <section v-if="activeTab === 'dashboard'" :class="{ loading: dashboardLoading }">

                  <div class="metric-label">支付成功率</div>

                </div>

              <div class="panel">

                    <pre>{{ jsonText(dashboard) }}</pre>

            <section v-else-if="activeTab === 'orders'" :class="{ loading: orderLoading }">

                  <input v-model="orderFilters.search" @keyup.enter="loadOrders(1)">

                <button class="primary" @click="loadOrders(1)">查询</button>

              </div>

              <div class="panel">
                <table>

                                  v-for="log in orderDetails[order.order_no].webhook.callback_logs"
                                  :key="log.id"
                                >
                                  <div class="log-head">
                                    <span>#{{ log.id }}</span>
                                    <span>{{ formatDate(log.created_at) }}</span>
                                    <span class="badge" :class="boolBadgeClass(log.after.signature_passed)">
                                      验签 {{ boolText(log.after.signature_passed, "通过", "失败") }}
                                    </span>
                                    <span class="badge" :class="amountBadgeClass(log.after.amount_matched)">
                                      金额 {{ boolText(log.after.amount_matched, "一致", "不一致") }}
                                    </span>
                                    <span class="badge" :class="log.after.duplicate_callback ? 'warn' : ''">
                                      {{ log.after.duplicate_callback ? "重复回调" : "首次/有效" }}
                                    </span>
                                  </div>
                                  <details>
                                    <summary>JSON</summary>
                                    <pre>{{ jsonText(log.after) }}</pre>
                                  </details>
                                </div>
                              </div>
                            </div>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div class="empty" v-if="!orders.items.length">暂无订单</div>
                <div class="pager">
                  <span>共 {{ orders.total }} 条，第 {{ orders.page }} 页，每页 {{ orders.size }} 条</span>
                  <span>
                    <button @click="previousPage" :disabled="orders.page <= 1">上一页</button>
                    <button @click="nextPage" :disabled="orders.page >= Math.ceil(orders.total / orders.size)">下一页</button>
                  </span>
                </div>
              </div>
            </section>

            <section v-else-if="activeTab === 'cdks'" :class="{ loading: cdkLoading }">
              <div class="toolbar">
                <label class="field">
                  <span class="label">状态</span>
                  <select v-model="cdkFilters.status" @change="loadCdks(1)">
                    <option value="">全部</option>
                    <option value="active">可用</option>
                    <option value="redeemed">已兑换</option>
                    <option value="expired">已过期</option>
                    <option value="disabled">已禁用</option>
                  </select>
                </label>
                <label class="field">
                  <span class="label">类型</span>
                  <select v-model="cdkFilters.type" @change="loadCdks(1)">
                    <option value="">全部</option>
                    <option value="single_use">单次兑换</option>
                    <option value="monthly_card">月卡</option>
                    <option value="credit_pack_5">5 额度包</option>
                    <option value="credit_pack_10">10 额度包</option>
                  </select>
                </label>
                <label class="field">
                  <span class="label">batch_id</span>
                  <input v-model.trim="cdkFilters.batch_id" @keyup.enter="loadCdks(1)">
                </label>
                <button class="primary" @click="loadCdks(1)">查询</button>
                <button @click="resetCdkFilters">重置</button>
                <button class="danger" @click="openCdkBatch">批量生成</button>
                <button @click="downloadCdkCsv">导出 CSV</button>
              </div>
              <div class="panel">
                <div class="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th style="width:190px">code</th>
                        <th style="width:120px">type</th>
                        <th style="width:80px">value</th>
                        <th style="width:100px">status</th>
                        <th style="width:130px">sales_channel</th>
                        <th style="width:180px">batch_id</th>
                        <th style="width:150px">redeemed_by</th>
                        <th style="width:170px">redeemed_at</th>
                        <th style="width:170px">created_at</th>
                      </tr>
                    </thead>
                    <tbody v-if="cdks.items.length">
                      <tr v-for="cdk in cdks.items" :key="cdk.code">
                        <td>{{ cdk.code }}</td>
                        <td>{{ cdkTypeText(cdk.type) }}</td>
                        <td>{{ cdk.value }}</td>
                        <td><span class="status-pill">{{ cdkStatusText(cdk.status) }}</span></td>
                        <td>{{ cdk.sales_channel || "-" }}</td>
                        <td>{{ cdk.batch_id || "-" }}</td>
                        <td>{{ cdk.redeemed_by || "-" }}</td>
                        <td>{{ formatDate(cdk.redeemed_at) }}</td>
                        <td>{{ formatDate(cdk.created_at) }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="empty" v-if="!cdks.items.length">暂无 CDK</div>
                <div class="pager">
                  <span>共 {{ cdks.total }} 条，第 {{ cdks.page }} 页，每页 {{ cdks.size }} 条</span>
                  <span>
                    <button @click="changePage('cdks', -1)" :disabled="cdks.page <= 1">上一页</button>
                    <button @click="changePage('cdks', 1)" :disabled="cdks.page >= Math.ceil(cdks.total / cdks.size)">下一页</button>
                  </span>
                </div>
              </div>
            </section>

            <section v-else-if="activeTab === 'users'" :class="{ loading: userLoading }">
              <div class="toolbar">
                <label class="field">
                  <span class="label">搜索 openid / nickname</span>
                  <input v-model.trim="userFilters.search" @keyup.enter="loadUsers(1)">
                </label>
                <button class="primary" @click="loadUsers(1)">查询</button>
                <button @click="resetUserFilters">重置</button>
              </div>
              <div class="panel">
                <div class="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th style="width:180px">openid</th>
                        <th style="width:140px">nickname</th>
                        <th style="width:110px">free_credits</th>
                        <th style="width:110px">paid_credits</th>
                        <th style="width:170px">月卡到期</th>
                        <th style="width:90px">artwork数</th>
                        <th style="width:170px">created_at</th>
                      </tr>
                    </thead>
                    <tbody v-if="users.items.length">
                      <tr class="clickable" v-for="user in users.items" :key="user.user_id" @click="selectUser(user)">
                        <td>{{ user.user_id }}</td>
                        <td>{{ user.nickname || "-" }}</td>
                        <td>{{ user.free_credits_remaining }}</td>
                        <td>{{ user.paid_credits }}</td>
                        <td>{{ formatDate(user.monthly_card_expires_at) }}</td>
                        <td>{{ user.artwork_count }}</td>
                        <td>{{ formatDate(user.created_at) }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="empty" v-if="!users.items.length">暂无用户</div>
                <div class="pager">
                  <span>共 {{ users.total }} 条，第 {{ users.page }} 页，每页 {{ users.size }} 条</span>
                  <span>
                    <button @click="changePage('users', -1)" :disabled="users.page <= 1">上一页</button>
                    <button @click="changePage('users', 1)" :disabled="users.page >= Math.ceil(users.total / users.size)">下一页</button>
                  </span>
                </div>
              </div>
            </section>

            <section v-else-if="activeTab === 'artworks'" :class="{ loading: artworkLoading }">
              <div class="toolbar">
                <label class="field">
                  <span class="label">user_id</span>
                  <input v-model.trim="artworkFilters.user_id" @keyup.enter="loadArtworks(1)">
                </label>
                <button class="primary" @click="loadArtworks(1)">查询</button>
                <button @click="resetArtworkFilters">重置</button>
              </div>
              <div class="panel">
                <div class="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th style="width:260px">artwork_id / preview</th>
                        <th style="width:170px">user</th>
                        <th style="width:110px">style</th>
                        <th style="width:100px">size</th>
                        <th style="width:90px">tier</th>
                        <th style="width:130px">is_paid_unlocked</th>
                        <th style="width:170px">created_at</th>
                      </tr>
                    </thead>
                    <tbody v-if="artworks.items.length">
                      <tr v-for="artwork in artworks.items" :key="artwork.artwork_id" :class="{ 'legacy-row': artwork.legacy_preview }">
                        <td>
                          <div class="thumb-cell">
                            <img v-if="previewSrc(artwork)" class="thumb" :src="previewSrc(artwork)" @error="$event.target.style.display='none'">
                            <span>{{ artwork.artwork_id }}</span>
                            <span v-if="artwork.legacy_preview" class="badge bad">legacy_preview</span>
                          </div>
                        </td>
                        <td>{{ artwork.user_id }}</td>
                        <td>{{ artwork.style_preset || "-" }}</td>
                        <td>{{ artwork.size_preset || "-" }}</td>
                        <td>{{ artwork.tier || "-" }}</td>
                        <td>{{ artwork.is_paid_unlocked ? "是" : "否" }}</td>
                        <td>{{ formatDate(artwork.created_at) }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="empty" v-if="!artworks.items.length">暂无作品</div>
                <div class="pager">
                  <span>共 {{ artworks.total }} 条，第 {{ artworks.page }} 页，每页 {{ artworks.size }} 条</span>
                  <span>
                    <button @click="changePage('artworks', -1)" :disabled="artworks.page <= 1">上一页</button>
                    <button @click="changePage('artworks', 1)" :disabled="artworks.page >= Math.ceil(artworks.total / artworks.size)">下一页</button>
                  </span>
                </div>
              </div>
            </section>

            <section v-else-if="activeTab === 'config'" :class="{ loading: configLoading }">
              <div class="panel">
                <div class="empty" v-if="!configData">暂无配置数据</div>
                <div v-else class="config-grid">
                  <div class="config-block">
                    <h3>public</h3>
                    <table>
                      <thead>
                        <tr><th style="width:220px">key</th><th>value</th></tr>
                      </thead>
                      <tbody>
                        <tr v-for="row in configPublicRows()" :key="row.key">
                          <td>{{ row.key }}</td>
                          <td>{{ row.value }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="config-block">
                    <h3>sensitive</h3>
                    <table>
                      <thead>
                        <tr>
                          <th style="width:170px">key</th>
                          <th style="width:170px">env</th>
                          <th style="width:100px">configured</th>
                          <th>state</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr v-for="row in configSensitiveRows()" :key="row.key">
                          <td>{{ row.key }}</td>
                          <td>{{ row.env }}</td>
                          <td><span class="badge" :class="row.configured ? 'ok' : ''">{{ row.configured ? "是" : "否" }}</span></td>
                          <td>
                            <span v-if="row.scheme !== '-'">scheme={{ row.scheme }}；</span>
                            <span v-if="row.password_configured !== undefined">password_configured={{ row.password_configured }}；</span>
                            <span v-if="row.host_configured !== undefined">host_configured={{ row.host_configured }}；</span>
                            <span v-if="row.database_configured !== undefined">database_configured={{ row.database_configured }}</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </section>

            <section v-else-if="activeTab === 'audit'" :class="{ loading: auditLoading }">
              <div class="toolbar">
                <label class="field">
                  <span class="label">action</span>
                  <input v-model.trim="auditFilters.action" @keyup.enter="loadAuditLogs(1)">
                </label>
                <label class="field">
                  <span class="label">resource_type</span>
                  <input v-model.trim="auditFilters.resource_type" @keyup.enter="loadAuditLogs(1)">
                </label>
                <label class="field">
                  <span class="label">actor_id</span>
                  <input v-model.trim="auditFilters.actor_id" @keyup.enter="loadAuditLogs(1)">
                </label>
                <button class="primary" @click="loadAuditLogs(1)">查询</button>
                <button @click="resetAuditFilters">重置</button>
              </div>
              <div class="panel">
                <div class="table-scroll">
                  <table>
                    <thead>
                      <tr>
                        <th style="width:170px">created_at</th>
                        <th style="width:150px">actor_id</th>
                        <th style="width:90px">role</th>
                        <th style="width:230px">action</th>
                        <th style="width:130px">resource_type</th>
                        <th style="width:170px">resource_id</th>
                        <th>reason</th>
                      </tr>
                    </thead>
                    <tbody v-if="auditLogs.items.length">
                      <template v-for="log in auditLogs.items" :key="log.id">
                        <tr class="clickable" @click="toggleAudit(log)">
                          <td>{{ formatDate(log.created_at) }}</td>
                          <td>{{ log.actor_id }}</td>
                          <td>{{ log.actor_role }}</td>
                          <td>{{ log.action }}</td>
                          <td>{{ log.resource_type }}</td>
                          <td>{{ log.resource_id || "-" }}</td>
                          <td>{{ log.reason }}</td>
                        </tr>
                        <tr v-if="expandedAuditId === log.id" class="detail-row">
                          <td colspan="7">
                            <div class="detail-grid">
                              <div class="detail-box">
                                <details open>
                                  <summary>before_json</summary>
                                  <pre>{{ jsonText(log.before) }}</pre>
                                </details>
                              </div>
                              <div class="detail-box">
                                <details open>
                                  <summary>after_json</summary>
                                  <pre>{{ jsonText(log.after) }}</pre>
                                </details>
                              </div>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="empty" v-if="!auditLogs.items.length">暂无审计日志</div>
                <div class="pager">
                  <span>共 {{ auditLogs.total }} 条，第 {{ auditLogs.page }} 页，每页 {{ auditLogs.size }} 条</span>
                  <span>
                    <button @click="changePage('auditLogs', -1)" :disabled="auditLogs.page <= 1">上一页</button>
                    <button @click="changePage('auditLogs', 1)" :disabled="auditLogs.page >= Math.ceil(auditLogs.total / auditLogs.size)">下一页</button>
                  </span>
                </div>
              </div>
            </section>
          </main>

          <div v-if="selectedUser" class="drawer-backdrop" @click="closeUserDrawer"></div>
          <aside v-if="selectedUser" class="drawer" :class="{ loading: userDetailLoading }">
            <div class="drawer-head">
              <h2>用户详情</h2>
              <button @click="closeUserDrawer">关闭</button>
            </div>
            <div class="drawer-body">
              <div class="drawer-section">
                <h3>{{ selectedUser.user_id }}</h3>
                <div class="kv">
                  <div class="kv-key">昵称</div><div class="kv-value">{{ selectedUser.nickname || "-" }}</div>
                  <div class="kv-key">免费额度</div><div class="kv-value">{{ selectedUser.free_credits_remaining }}</div>
                  <div class="kv-key">付费额度</div><div class="kv-value">{{ selectedUser.paid_credits }}</div>
                  <div class="kv-key">月卡到期</div><div class="kv-value">{{ formatDate(selectedUser.monthly_card_expires_at) }}</div>
                  <div class="kv-key">作品数</div><div class="kv-value">{{ selectedUser.artwork_count }}</div>
                  <div class="kv-key">创建时间</div><div class="kv-value">{{ formatDate(selectedUser.created_at) }}</div>
                </div>
              </div>

              <form class="drawer-section" @submit.prevent="openCreditModal">
                <h3>调整额度</h3>
                <div class="form-grid">
                  <label class="field">
                    <span class="label">delta_free</span>
                    <input v-model="creditForm.delta_free" type="number" step="1" placeholder="例如 1 或 -1">
                  </label>
                  <label class="field">
                    <span class="label">delta_paid</span>
                    <input v-model="creditForm.delta_paid" type="number" step="1" placeholder="例如 1 或 -1">
                  </label>
                  <label class="field">
                    <span class="label">set_monthly_card_days</span>
                    <input v-model="creditForm.set_monthly_card_days" type="number" min="0" step="1" placeholder="0 表示清空">
                  </label>
                  <label class="field full">
                    <span class="label">reason</span>
                    <textarea v-model="creditForm.reason" placeholder="请输入操作原因" required></textarea>
                  </label>
                </div>
                <p class="danger-note">额度变动绝对值大于 100 时，确认框会要求二次确认。</p>
                <button class="danger" type="submit">调整额度</button>
              </form>

              <div class="drawer-section">
                <h3>最近 10 单</h3>
                <div v-if="!selectedUser.recent_orders || !selectedUser.recent_orders.length" class="empty">暂无订单</div>
                <table v-else>
                  <thead>
                    <tr>
                      <th>order_no</th>
                      <th style="width:90px">金额</th>
                      <th style="width:110px">状态</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr v-for="order in selectedUser.recent_orders" :key="order.order_no">
                      <td>{{ order.order_no }}</td>
                      <td>¥{{ formatMoney(order.amount_cny) }}</td>
                      <td>{{ statusText(order.raw_status) }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </aside>

          <div v-if="cdkBatchOpen" class="modal-backdrop" @click.self="closeCdkBatch">
            <form class="modal" :class="{ loading: cdkBatchLoading }" @submit.prevent="submitCdkBatch">
              <div class="modal-head">
                <h2>批量生成 CDK</h2>
                <button type="button" @click="closeCdkBatch">关闭</button>
              </div>
              <div class="modal-body">
                <div class="impact">
                  <div><strong>影响：</strong>生成一批可兑换 CDK，created_by 为当前管理员。</div>
                  <div><strong>审计：</strong>提交后写入 admin.cdk.batch_generate。</div>
                </div>
                <div class="form-grid">
                  <label class="field">
                    <span class="label">type</span>
                    <select v-model="cdkForm.type" required>
                      <option value="single_use">single_use</option>
                      <option value="monthly_card">monthly_card</option>
                      <option value="credit_pack_5">credit_pack_5</option>
                      <option value="credit_pack_10">credit_pack_10</option>
                    </select>
                  </label>
                  <label class="field">
                    <span class="label">value</span>
                    <input v-model.number="cdkForm.value" type="number" min="1" step="1" required>
                  </label>
                  <label class="field">
                    <span class="label">count</span>
                    <input v-model.number="cdkForm.count" type="number" min="1" max="500" step="1" required>
                  </label>
                  <label class="field">
                    <span class="label">sales_channel</span>
                    <input v-model.trim="cdkForm.sales_channel">
                  </label>
                  <label class="field">
                    <span class="label">expires_at</span>
                    <input v-model="cdkForm.expires_at" type="datetime-local">
                  </label>
                  <label class="field full">
                    <span class="label">notes</span>
                    <input v-model.trim="cdkForm.notes">
                  </label>
                  <label class="field full">
                    <span class="label">reason</span>
                    <textarea v-model="cdkForm.reason" placeholder="请输入操作原因" required></textarea>
                  </label>
                </div>
                <div v-if="cdkGenerated">
                  <div class="inline-actions">
                    <span class="badge ok">batch_id={{ cdkGenerated.batch_id }}</span>
                    <span class="badge ok">audit_id={{ cdkGenerated.audit_id }}</span>
                    <button type="button" @click="copyGeneratedCodes">复制 codes</button>
                  </div>
                  <textarea class="code-output" readonly :value="cdkGenerated.codes.join(String.fromCharCode(10))"></textarea>
                </div>
              </div>
              <div class="modal-foot">
                <button type="button" @click="closeCdkBatch">取消</button>
                <button class="danger" type="submit" :disabled="cdkBatchLoading || !cdkForm.reason.trim()">确认生成</button>
              </div>
            </form>
          </div>

          <div v-if="modal" class="modal-backdrop" @click.self="closeModal">
            <div class="modal" :class="{ loading: modal.loading }">
              <div class="modal-head">
                <h2>{{ modal.title }}</h2>
                <button @click="closeModal">关闭</button>
              </div>
              <div class="modal-body">
                <div class="impact">
                  <div v-for="line in modal.impactLines" :key="line">{{ line }}</div>
                </div>
                <label class="field">
                  <span class="label">reason</span>
                  <textarea v-model="modal.reason" placeholder="请输入操作原因" required></textarea>
                </label>
                <label v-if="modal.requiresSecondConfirm" class="checkbox-row">
                  <input type="checkbox" v-model="modal.secondConfirmed">
                  <span>我确认本次单项额度变动绝对值超过 100，已核对用户、额度和 reason。</span>
                </label>
              </div>
              <div class="modal-foot">
                <button @click="closeModal">取消</button>
                <button class="danger" @click="submitModal" :disabled="modal.loading || !modal.reason.trim() || (modal.requiresSecondConfirm && !modal.secondConfirmed)">
                  确认执行
                </button>
              </div>
            </div>
          </div>
        </div>
      `
    }).mount("#app");
  </script>
</body>
</html>
