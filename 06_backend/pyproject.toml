[tool.poetry]
name = "pindou-backend"
version = "0.1.0"
description = "PinDou Phase 2 FastAPI backend"
authors = ["PinDou Team"]
readme = "README.md"
packages = [{ include = "pindou" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
pillow = "^11.0.0"
numpy = "^2.0.0"
scikit-learn = "^1.5.0"
colormath = "^3.0.0"
openai = "^1.55.0"
python-dotenv = "^1.0.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.9"
requests = "^2.32.0"
pymysql = "^1.1.0"
cryptography = "^46.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
